[package]
name = "rexling-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"

[features]
default = ["ghostty"]
ghostty = []

[build-dependencies]
cc = "1"

[dependencies]
anyhow = "1"
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
percent-encoding = "2.3"
png = "0.18"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time", "sync"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
url = "2.5"

[workspace]
members = [".", "jni", "probe"]
resolver = "2"
