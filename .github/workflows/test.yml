name: Tests

# Unit tests on every branch push: native Rust (with libghostty-vt), then the
# Kotlin JVM tests and a compile of the instrumented tests. No signing, no APK.
on:
  push:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK packages
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdk" --licenses > /dev/null
          "$sdk" "platforms;android-37.0" "build-tools;36.0.0" "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rexling-core/.build
            rexling-core/target
          key: native-${{ hashFiles('rexling-core/Cargo.lock', 'rexling-core/native/ghostty-source.json') }}
          restore-keys: native-

      - name: Rust tests (host libghostty-vt)
        working-directory: rexling-core
        run: |
          python3 scripts/build_native.py --host-test
          cargo test --locked --lib
          cargo test --locked -p rexling-jni --lib

      - name: Kotlin unit tests and instrumented-test compile
        working-directory: rexling-android
        run: ./gradlew --no-daemon :app:testReleaseUnitTest :app:compileDebugAndroidTestKotlin

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: rexling-android/app/build/reports/tests/
          retention-days: 7
